@route:/
<!doctype html>
<!-- 루트 페이지(WebUiPage 모드): 얇은 셸. 화면 조각은 sysinfo/settings/panel 컴포넌트가,
     로그인은 서버가 별도 /login 페이지로 서빙합니다(미인증 GET /는 302 리다이렉트),
     transport·bindForm·이벤트는 core.js(WebUi)가 담당합니다. 이 파일은 조립과 폴러만 남깁니다.
     heartbeat는 @instance 마커로 반복 인스턴스 예시(상태 탭 + 설정 탭에서 재사용).
     tabs/form/modal은 라이브러리 컴포넌트: 내비·라우팅, 설정 폼 렌더, 확인 대화상자를 대신 담당합니다.
     conn-dot/uptime/heap-gauge는 ops 표시 인스턴스(Grafana 스타일): 속성으로 임계값·문구를 조절합니다.
     statistic/progress 인스턴스와 form의 seg/switch fmt(Ant/Fluent 스타일)로 설정 폼과 상태판이 풍부해집니다.
     alert/result/card/export-import/firmware(도구 탭)는 유지보수 조합: card는 slot으로 본문을 감쌉니다.
     들여쓰기는 자유롭게: 빌드 시 줄 앞뒤 공백과 주석은 모두 제거됩니다.
     사용자 정의 다국어: heartbeat가 프로젝트 사전(WebUi\texts*.resx)의 hb.* 키로 문구를 읽고,
     conn.label 재정의 데모 — 프로젝트 루트 사전이 라이브러리 사전을 키 단위로 덮어씁니다. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VagabondK.nF WebUi 샘플</title>
    <style>
      /* 색감 토큰(:root)은 WebUi\theme.css에서 정의됩니다 — 로그인과 메인 페이지가 공유합니다. */
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--tx);
        font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      header {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px; background: var(--card); flex-wrap: wrap;
      }
      header b { margin-right: auto; }
      main { max-width: 680px; margin: 16px auto; padding: 0 16px; }
      section {
        background: var(--card); border-radius: 10px;
        padding: 16px; margin-bottom: 16px;
      }
      h1 { font-size: 16px; margin: 0 0 10px; }
      h2 { font-size: 14px; margin: 14px 0 6px; color: var(--mut); }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
      dt { color: var(--mut); }
      dd { margin: 0; }
      input, select {
        background: var(--fld, #0b1220); color: var(--tx); border: 1px solid #334155;
        border-radius: 6px; padding: 6px 8px; font: inherit; width: 280px; max-width: 100%;
      }
      /* 컴포넌트(:host(:focus-within) ring)와 같은 --acc 토큰 — 그림자 안의 input까지 이 규칙이 닿습니다. */
      input:focus, select:focus { outline: 2px solid var(--acc, #38bdf8); border-color: transparent; }
      button.act {
        background: var(--in); border: 0; color: #04252f; font: inherit;
        font-weight: 600; border-radius: 6px; padding: 8px 14px; cursor: pointer;
      }
      button.act:disabled, button.gh:disabled { opacity: .4; cursor: default; }
      button.gh {
        background: none; border: 1px solid #334155; color: var(--mut); font: inherit;
        border-radius: 6px; padding: 6px 10px; cursor: pointer;
      }
      .msg { color: var(--mut); margin: 6px 0; }
      .bad { color: var(--bad); }
      .dot::after {
        content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
        background: var(--in); margin-left: 5px; vertical-align: middle;
      }
      #toasts { position: fixed; bottom: 14px; right: 14px; display: grid; gap: 8px; z-index: 20; }
      .toast { background: #334155; padding: 8px 12px; border-radius: 8px; }
      .toast.bad { background: #7f1d1d; }
      .toast.out { opacity: 0; transition: opacity .5s; }
      #pv { border-top: 1px solid #334155; margin-top: 12px; padding-top: 4px; }
      .age { color: var(--mut); font-size: 12px; }
      .ops { display: flex; align-items: center; gap: 14px; margin: 6px 0; }
      [hidden] { display: none !important; }
    </style>
<nf-style/>
  </head>
  <body>
    <header>
      <b>VagabondK.nF WebUi 샘플</b>
      <span id="hIp" class="msg"></span>
      <tabs />
      <button id="btnOut" class="gh" hidden>로그아웃</button>
    </header>
    <main>
      <section data-tab="상태">
        <h1>장치 상태</h1>
        <ap-banner />
        <p class="ops">
          <conn-dot timeout="6" />
          <uptime long />
        </p>
        <p>
          <heap-gauge />
        </p>
        <p class="ops">
          <statistic label="요청 수" key="requests" />
          <statistic label="남은 힙" key="heapFree" fmt="kb" />
        </p>
        <p class="ops">
          <sparkline key="requests" />
          <clock />
        </p>
        <p class="ops">
          <progress label="대기 중" />
          <button id="pgDemo" class="gh" type="button">진행 데모</button>
        </p>
        <sysinfo />
        <descriptions title="장치 정보" keys="deviceName,pollMs,mode,debug" />
        <status-card />
        <panel />
      </section>
      <settings />
      <section data-tab="도구">
        <h1>유지보수 도구</h1>
        <alert
          severity="warn"
          text="설정을 변경하기 전에 백업을 내보내 두세요."
        />
        <wui-card title="설정 백업">
          <export-import />
        </wui-card>
        <wui-card title="펌웨어 업데이트">
          <firmware api="/api/firmware" />
          <result />
        </wui-card>
        <wui-card title="표시 컴포넌트">
          <p class="ops">
            <wui-badge variant="ok">연결</wui-badge>
            <wui-badge variant="warn">저하</wui-badge>
            <wui-badge variant="bad">두절</wui-badge>
            <wui-badge>12</wui-badge>
          </p>
          <p>
            <wui-chip removable>RTU</wui-chip>
            <wui-chip removable>ASCII</wui-chip>
            <wui-chip>필터</wui-chip>
          </p>
          <p class="ops">
            <spinner />
            <span class="msg">불러오는 중…</span>
          </p>
          <skeleton w="100%" h="14" />
          <skeleton w="60%" h="14" />
          <empty text="로그 없음" icon="▤" />
        </wui-card>
        <wui-card title="단계와 접기">
          <steps items="다운로드|전송|적용" current="2" />
          <wui-collapse title="고급 설정">
            <span class="msg"
              >시리얼 타임아웃·재시도 횟수 같은 고급 항목 자리.</span
            >
          </wui-collapse>
          <wui-navbar title="게이트웨이">
            <conn-dot timeout="6" />
          </wui-navbar>
        </wui-card>
        <wui-card title="장치 관리">
          <list-group items="요약|상세|로그" selected="1" />
          <p class="ops">
            <reboot api="/api/reboot" secs="8" />
          </p>
        </wui-card>
        <wui-card title="폼 도우미">
          <p class="ops">
            <number value="500" min="0" max="9999" step="100" />
            <span class="msg" id="numOut">폴링: 500ms</span>
          </p>
          <p class="ops">
            <search placeholder="로그 검색" />
            <password placeholder="관리자 비밀번호" />
          </p>
          <wui-input-group placeholder="192.168.0.10">
            <b slot="pre">http://</b>
            <b slot="post">:502</b>
          </wui-input-group>
        </wui-card>
        <wui-card title="내비게이션 도우미">
          <p class="ops">
            <breadcrumb items="홈|설정|포인트" />
            <pagination page="2" total="5" />
            <span class="msg" id="pgOut">페이지 2</span>
          </p>
          <timeline
            items="10:04 게이트웨이 기동|10:05 DNP3 연결|10:09 폴링 시작"
          />
          <p>
            <wui-tooltip text="DNP3 마스터 IP">
              <button type="button">도움말</button>
            </wui-tooltip>
          </p>
        </wui-card>
        <wui-card title="레이아웃">
          <wui-grid cols="3">
            <span class="msg">셀 1</span>
            <span class="msg">셀 2</span>
            <span class="msg">셀 3</span>
          </wui-grid>
          <wui-groupbox title="통신 파라미터">
            <p class="msg">
              fieldset/legend식 그룹 박스 — 본문은 slot으로 들어옵니다.
            </p>
          </wui-groupbox>
          <divider label="구간 끝" />
        </wui-card>
        <wui-card title="데이터 도구">
          <log-tail api="/api/log" lines="8" ms="2000" />
          <register-view api="/api/registers" cols="8" ms="2000" />
        </wui-card>
        <wui-card title="네트워크">
          <wifi-form api="/api/network" />
        </wui-card>
      </section>
    </main>
    <wui-drawer id="dw" title="항목 상세">
      <p class="msg" id="dwMsg">
        list-group 행을 클릭하면 여는 상세 패널 자리.
      </p>
    </wui-drawer>
    <modal />
    <static />
    <div id="toasts"></div>
<nf-core/>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      let failures = 0,
        SRV = {};

      async function checkAuth() {
        const a = await WebUi.api("/api/auth/status");
        if (a.csrfHeader) WebUi.csrf(a.csrfHeader);
        SRV = a;
        if (a.limits) $("wf").deviceName.maxLength = a.limits.nameMax;
        const authed = !a.authEnabled || a.loggedIn;
        $("btnOut").hidden = !(a.authEnabled && a.loggedIn);
        if (!authed) location.replace("/login" + location.hash);
        return authed;
      }

      // 헤더의 로그아웃 버튼: 확인은 modal 컴포넌트(WebUi.modal)로 하고, 세션을 반납한 뒤 로그인 페이지로.
      $("btnOut").onclick = async () => {
        if (
          !(await WebUi.modal({
            title: "로그아웃",
            body: "로그아웃하시겠습니까?",
          }))
        )
          return;
        try {
          await WebUi.post("/api/auth/logout", "");
        } catch (e) {}
        location.replace("/login" + location.hash);
      };

      // 헤더도 다른 컴포넌트와 똑같이 이벤트를 구독합니다(페이지가 버스 바깥에 있지 않습니다).
      WebUi.on("wui:status", (s) => {
        $("hIp").textContent = s.ip;
      });

      // list-group 행 클릭 → drawer에 내용 채우고 열기(컴포넌트 간 결합 예시).
      WebUi.on("wui:list-click", (d) => {
        $("dwMsg").textContent = "항목 " + d.index + ": " + d.text;
        $("dw").setAttribute("open", "");
      });

      // number 스테퍼 변경 구독(인스턴스 → 페이지 단방향 데이터 흐름 예시).
      WebUi.on("wui:number-change", (d) => {
        $("numOut").textContent = "폴링: " + d.value + "ms";
      });
      // search 디바운스 결과 구독 — 실제 페이지에서는 표 필터링에 씁니다.
      WebUi.on("wui:search", (d) => {
        if (d.q) WebUi.toast("검색: " + d.q, "ok");
      });
      // pagination 이동 구독(표 페이징 결합 예시).
      WebUi.on("wui:page", (d) => {
        $("pgOut").textContent = "페이지 " + d.page;
      });

      async function refresh() {
        try {
          if (!(await checkAuth())) return;
          WebUi.status(await WebUi.api("/api/status", null, 5000));
          failures = 0;
        } catch (e) {
          if (++failures >= 2 && !e.unauth) $("hIp").textContent = "연결 끊김";
        }
      }

      setInterval(() => WebUi.tick(), 1000);
      setInterval(refresh, 2000);
      refresh();

      // progress 인스턴스 데모: wui:progress 이벤트 한 방으로 바가 갱신됩니다(firmware/export가 같은 규약).
      $("pgDemo").onclick = function () {
        var v = 0;
        var t = setInterval(function () {
          v += 10;
          document.dispatchEvent(
            new CustomEvent("wui:progress", {
              detail: { value: v, label: v >= 100 ? "완료" : "전송 중…" },
            }),
          );
          if (v >= 100) clearInterval(t);
        }, 120);
      };
</script>
<nf-script/>
  </body>
</html>
