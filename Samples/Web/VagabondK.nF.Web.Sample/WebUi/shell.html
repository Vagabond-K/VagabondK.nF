<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VagabondK.nF WebUi 샘플</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ok:#22c55e;--bad:#ef4444;--in:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);flex-wrap:wrap}
header b{margin-right:auto}
nav button{background:none;border:0;color:var(--mut);font:inherit;padding:6px 10px;cursor:pointer;border-radius:6px}
nav button.on{color:var(--tx);background:#334155}
main{max-width:680px;margin:16px auto;padding:0 16px}
section{background:var(--card);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:16px;margin:0 0 10px}
h2{font-size:14px;margin:14px 0 6px;color:var(--mut)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dt{color:var(--mut)}
dd{margin:0}
label.row{display:block;margin:10px 0}
label.row span{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
input,select{background:#0b1220;color:var(--tx);border:1px solid #334155;border-radius:6px;padding:6px 8px;font:inherit;width:280px;max-width:100%}
button.act{background:var(--in);border:0;color:#04252f;font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer}
button.act:disabled,button.gh:disabled{opacity:.4;cursor:default}
button.gh{background:none;border:1px solid #334155;color:var(--mut);font:inherit;border-radius:6px;padding:6px 10px;cursor:pointer}
.msg{color:var(--mut);margin:6px 0}
.bad{color:var(--bad)}
.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--in);margin-left:5px;vertical-align:middle}
#login{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10}
#login form{background:var(--card);padding:22px;border-radius:10px;display:grid;gap:10px;min-width:300px}
#toasts{position:fixed;bottom:14px;right:14px;display:grid;gap:8px;z-index:20}
.toast{background:#334155;padding:8px 12px;border-radius:8px}
.toast.bad{background:#7f1d1d}
[hidden]{display:none}
<!--@style-->
</style>
</head>
<body>
<header>
<b>VagabondK.nF WebUi 샘플</b>
<span id="hIp" class="msg"></span>
<nav>
<button id="t-status" class="on">상태</button>
<button id="t-settings">설정</button>
</nav>
<button id="btnOut" class="gh" hidden>로그아웃</button>
</header>
<main>
<section id="v-status">
<h1>장치 상태</h1>
<dl id="sysDl"></dl>
<div id="pv"></div>
</section>
<!--@views-->
</main>
<div id="login" hidden>
<form id="loginForm">
<b>관리자 비밀번호</b>
<input type="password" id="pw" autocomplete="current-password">
<p id="loginMsg" class="bad"></p>
<button class="act">로그인</button>
</form>
</div>
<div id="toasts"></div>
<script>
'use strict';
<!--@manifest-->
<!--@core-->
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const feat = WebUi.feat, MAN = WebUi.M;
const KEYS = WebUi.KEYS, LABELS = WebUi.LABELS;
let st = null, seenAt = 0, base = null, authed = false, failures = 0;
const formValues = () => WebUi.values($('sf'));
function fillForm(s) { base = WebUi.fill($('sf'), s); syncForm(); }
const settingsBody = v => new URLSearchParams(Object.assign({schemaVersion: String(MAN.schema), gatewayProfile: MAN.id}, v));
function formState(errs) {
const v = formValues(), chg = base ? KEYS.filter(k => v[k] !== base[k]) : [];
const bad = Object.keys(errs).length;
$('sfSave').disabled = !base || !chg.length || bad > 0;
$('sfUndo').disabled = !chg.length;
$('sfState').textContent = !base ? '설정을 불러오는 중…' : bad ? '입력값을 확인하세요.' : chg.length ? '변경 ' + chg.length + '건 · 아직 저장하지 않음' : '장치에 저장된 설정과 같습니다.';
$('t-settings').classList.toggle('dot', chg.length > 0);
return {v, changed: chg, bad};
}
function formChanges(v) {
return KEYS.filter(k => v[k] !== base[k]).map(k => LABELS[k] + ': ' + WebUi.showValue($('sf'), k, base[k]) + ' → ' + WebUi.showValue($('sf'), k, v[k]));
}
async function api(path, opt, ms) {
const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms || 8000);
try {
const r = await fetch(path, Object.assign({cache: 'no-store', signal: ac.signal}, opt));
const json = (r.headers.get('Content-Type') || '').includes('json');
const body = json ? await r.json().catch(() => ({})) : await r.text();
if (!r.ok) { const err = new Error((json && body.error) || 'HTTP ' + r.status); if (r.status === 401) showLogin('세션이 만료되었습니다. 다시 로그인하세요.'); throw err; }
return body;
} catch (e) {
if (e.name === 'AbortError') throw new Error('장치 응답 시간이 초과되었습니다.');
if (e instanceof TypeError) throw new Error('장치에 연결할 수 없습니다.');
throw e;
} finally { clearTimeout(timer); }
}
let csrfH = '';
// CSRF 마커 헤더명은 서버(CsrfMarker)가 단일 출처다: /api/auth/status로 받아 쓴다.
async function csrf() {
if (!csrfH) { try { csrfH = ((await api('/api/auth/status', null, 4000)).csrfHeader) || ''; } catch (e) {} }
return csrfH;
}
const post = async (path, body) => api(path, {method: 'POST', headers: {[await csrf()]: '1', 'Content-Type': 'application/x-www-form-urlencoded'}, body: body || ''});
function toast(text, bad) {
const t = el('div', 'toast' + (bad ? ' bad' : ''), text);
$('toasts').append(t);
setTimeout(() => t.remove(), bad ? 7000 : 3500);
}
function showLogin(msg) { authed = false; $('login').hidden = false; $('loginMsg').textContent = msg || ''; }
async function checkAuth() {
const a = await api('/api/auth/status');
if (a.csrfHeader) csrfH = a.csrfHeader;
authed = !a.authEnabled || a.loggedIn;
$('btnOut').hidden = !a.authEnabled || !a.loggedIn;
$('login').hidden = authed;
return authed;
}
function dur(sec) {
sec = Math.max(0, Math.floor(sec));
const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
return h ? h + '시간 ' + m + '분' : m ? m + '분 ' + (sec % 60) + '초' : sec + '초';
}
const kb = v => (v / 1024).toFixed(1) + ' KB';
function fillDl(id, rows) {
const d = $(id);
d.textContent = '';
for (const [k, v] of rows) d.append(el('dt', '', k), el('dd', '', String(v)));
}
function route() {
const v = location.hash === '#settings' ? 'settings' : 'status';
$('v-status').hidden = v !== 'status';
$('v-settings').hidden = v !== 'settings';
$('t-status').classList.toggle('on', v === 'status');
$('t-settings').classList.toggle('on', v === 'settings');
}
addEventListener('hashchange', route);
$('t-status').onclick = () => location.hash = '';
$('t-settings').onclick = () => location.hash = 'settings';
function render() {
$('hIp').textContent = st.ip;
fillDl('sysDl', [['가동 시간', dur(st.uptime + (Date.now() - seenAt) / 1000)], ['남은 힙', kb(st.heapFree)], ['요청 수', st.requests], ['프로필', MAN.id]]);
profileRender(st);
tick();
}
function tick() { if (st) profileTick(st.uptime + (Date.now() - seenAt) / 1000); }
async function refresh() {
try {
if (!await checkAuth()) return;
st = await api('/api/status', null, 5000);
seenAt = Date.now();
failures = 0;
if (!base) fillForm(st);
render();
} catch (e) {
if (++failures >= 2) $('hIp').textContent = '연결 끊김';
}
}
$('loginForm').onsubmit = async ev => {
ev.preventDefault();
try {
await post('/api/auth/login', 'password=' + encodeURIComponent($('pw').value));
$('pw').value = '';
$('login').hidden = true;
authed = true;
$('btnOut').hidden = false;
failures = 0;
refresh();
} catch (err) { $('loginMsg').textContent = err.message; }
};
$('btnOut').onclick = async () => { try { await post('/api/auth/logout', ''); } catch (e) {} location.reload(); };
$('sfSave').onclick = async () => {
const v = formValues();
if (Object.keys(checkSettings(v)).length) { syncForm(); return; }
if (!confirm('설정을 저장할까요?\n' + formChanges(v).join('\n'))) return;
try {
await post('/api/settings', settingsBody(v).toString());
base = v;
syncForm();
toast('저장했습니다.');
} catch (e) { toast(e.message, true); }
};
$('sfUndo').onclick = () => { if (st) fillForm(st); };
$('sf').addEventListener('input', syncForm);
setInterval(tick, 1000);
setInterval(refresh, 2000);
route();
refresh();
<!--@script-->
</script>
</body>
</html>
